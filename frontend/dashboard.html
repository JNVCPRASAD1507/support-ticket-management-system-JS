
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Support Tickets</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">🎫 <span>Support</span> Tickets</div>
      <nav class="sidebar-nav">
        <a href="#" data-view="tickets" class="active">📋 Tickets</a>
        <a href="#" data-view="create">➕ New Ticket</a>
        <a href="#" data-view="categories" id="nav-categories">🏷️ Categories</a>
        <a href="#" data-view="users" id="nav-users" class="hidden">👥 Users</a>
        <a href="#" data-view="notifications">🔔 Notifications</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <strong id="user-name">—</strong>
          <span id="user-role">—</span>
        </div>
        <button class="btn btn-secondary btn-sm btn-block" id="logout-btn">Logout</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <h2 id="page-title">Tickets</h2>
        <div id="topbar-actions"></div>
      </header>
      <div class="content" id="content">
        <div class="loading">Loading…</div>
      </div>
    </div>
  </div>

  <!-- Modal root -->
  <div id="modal-root"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
